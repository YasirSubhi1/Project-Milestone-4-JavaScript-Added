<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Yasir Subhi</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1 id="main-title"><a href="contact.html">About and Contact</a></h1>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section>
            <h2>Contact</h2>

            <img id="contact-image"
                 src="contact img.jpg"
                 alt="Cat holding phone">
        </section>

        <form id="contact-form" novalidate>

            <label for="name">Name:</label>

            <input
                type="text"
                id="name"
                name="name"
                aria-describedby="name-error">

            <p id="name-error"
               class="error"
               aria-live="polite"></p>


            <label for="email">Email:</label>

            <input
                type="email"
                id="email"
                name="email"
                aria-describedby="email-error">

            <p id="email-error"
               class="error"
               aria-live="polite"></p>


            <label for="message">Message:</label>

            <textarea
                id="message"
                name="message"
                aria-describedby="message-error"></textarea>

            <p id="message-error"
               class="error"
               aria-live="polite"></p>


            <button type="submit">Send</button>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 Yasir Subhi</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
